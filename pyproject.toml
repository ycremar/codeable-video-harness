[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-code-harness"
version = "0.1.0"
description = "Evidence-first, model-neutral harness for code-rendered video"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0", "numpy==2.3.5"]

[project.scripts]
vch = "vch.cli:main"

[tool.setuptools.packages.find]
include = ["vch*"]
