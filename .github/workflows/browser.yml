name: browser-render-smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/prepare_fonts.py
      - run: npm ci --prefix backends/pdoom && npm run build --prefix backends/pdoom
      - run: VCH_TEST_BROWSER=1 python -m unittest discover -s tests -p test_browser.py -v
      # Chromium's sandbox often cannot start on hosted CI runners (restricted user namespaces); local runs keep it on.
      - run: VCH_TEST_BROWSER=1 VCH_CHROMIUM_NO_SANDBOX=1 python -m unittest discover -s tests -p test_html_backend.py -v
