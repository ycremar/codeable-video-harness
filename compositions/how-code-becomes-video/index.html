<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How code becomes video</title>
<!--
  Original 48-second explainer for the vch `html` backend. Contract: examples/how-code-becomes-video.json.

  One continuous camera over one world: a wall of 475 tiles (a public collection of code-rendered
  videos), a five-station line (brief, code, capture, sound, check) that a card travels along, and
  the measurements of 38 files. Every visual property is computed inside seek(t); nothing is carried
  between frames. The only cache holds miniature renders of this film's own frames, which are a pure
  function of t, so a cache hit and a fresh render are identical.

  Numbers on screen come from three sources, loaded once before the first frame:
    /contract.json  requirements, cue sheet (timing.hits, which also times the picture), loudness target
    this file       its own line count and the seek(t) excerpt shown in station 02
    corpus.json     aggregates of docs/OPUS_VIDEO_RESEARCH.md (38 measured files, numbers only)

  Preview without the harness: serve the repository root (python -m http.server) and open
  /compositions/how-code-becomes-video/index.html; it loops on the wall clock.
-->
<style>
  @font-face { font-family: "Inter"; src: url("/assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "JBMono"; src: url("/assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #060B18;
           font-family: "Inter", sans-serif; color: #EEF3FF; transform-origin: 0 0; }
  #world { position: absolute; left: 0; top: 0; }
  #dom { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .mono { font-family: "JBMono", monospace; font-variant-ligatures: none; }
  .block { position: absolute; left: 96px; top: 150px; width: 800px; }
  .kicker { font: 600 24px/1.2 "JBMono", monospace; letter-spacing: 0.14em; color: #46E3B7; }
  .headline { margin-top: 22px; font-weight: 720; font-size: 64px; line-height: 1.08; letter-spacing: -0.028em; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.05em 0.12em 0; margin-bottom: -0.12em; }
  .word { display: inline-block; }
  .desc { margin-top: 24px; font-size: 30px; line-height: 1.36; color: #AAB7D8; width: 740px; }
  .note { margin-top: 26px; font-size: 26px; line-height: 1.4; color: #C9D3EC; width: 720px; }
  .stat { margin-top: 18px; display: flex; gap: 18px; align-items: baseline; }
  .stat .num { font: 700 34px/1.2 "JBMono", monospace; min-width: 236px; }
  .stat .what { font-size: 26px; line-height: 1.3; color: #C9D3EC; white-space: normal; width: 480px; }
  .finale { font-weight: 760; font-size: 92px; line-height: 1.04; letter-spacing: -0.035em; width: 1000px; }
  .label { font: 500 24px/1.2 "JBMono", monospace; color: #AAB7D8; }
  .sans { font-family: "Inter", sans-serif; font-weight: 500; }
  .chip { font: 700 24px/1.2 "JBMono", monospace; color: #06101F; }
  .code { font: 500 24px/1.2 "JBMono", monospace; color: #DCE4F7; }
  .k { color: #C3A6FF; } .f { color: #7AA7FF; } .n { color: #46E3B7; } .p { color: #8592B5; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="world" width="1920" height="1080"></canvas>
  <div id="dom"></div>
</div>
<script>
(() => {
  "use strict";
  const W = 1920, H = 1080, FPS = 30;
  const $ = (id) => document.getElementById(id);
  const vch = (window.__vch = window.__vch || {});
  const harness = Boolean(vch.harness);

  const C = {
    ink: "#EEF3FF", soft: "#AAB7D8", dim: "#8592B5", mint: "#46E3B7", blue: "#7AA7FF",
    violet: "#B69CFF", amber: "#FFC857", coral: "#FF7A70", panel: "rgba(12,21,44,0.94)",
    edge: "#2A3B66", well: "#0A1226", lane: "#0F1B38", dark: "#06101F",
  };
  const KIND_COLOR = { hard: C.blue, proxy: C.mint, human: C.amber };
  const CUE_COLOR = { whoosh: C.violet, impact: C.coral, chime: C.amber, tick: C.mint };
  const CATEGORY_COLOR = { motion: C.blue, interactive: C.violet, explainer: C.mint, "3D": C.amber };

  // ---------- pure time helpers ----------
  const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeIn = (x) => Math.pow(clamp(x), 3);
  // Closed-form step response of an underdamped spring; snapped once settled so rests are exact.
  function spring(tau, period = 0.45, zeta = 0.78) {
    if (tau <= 0) return 0;
    const w = 2 * Math.PI / period, wd = w * Math.sqrt(1 - zeta * zeta);
    const v = 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + (zeta * w / wd) * Math.sin(wd * tau));
    return tau > 2 * period && Math.abs(1 - v) < 2e-3 ? 1 : v;
  }
  // 0 outside [a, b); eases in over `fin` and out over the last `fout` seconds.
  const windowed = (t, a, b, fin = 0.3, fout = 0.25) =>
    t < a || t >= b ? 0 : Math.min(easeOut((t - a) / fin), 1 - easeIn((t - (b - fout)) / fout));
  function hash(n) {
    let x = (n | 0) + 0x9e3779b9;
    x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
    x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  const pad = (n, w) => String(n).padStart(w, "0");
  const fmt = (n) => n.toLocaleString("en-US");
  const minus = (s) => String(s).replace("-", "−");

  // ---------- data (loaded once, read-only afterwards) ----------
  let DATA = null;
  const cue = (name) => {
    const t = DATA.cues.get(name);
    if (t === undefined) throw new Error(`Missing cue in contract timing.hits: ${name}`);
    return t;
  };
  const EXCERPT_OPEN = "// <" + "excerpt>", EXCERPT_CLOSE = "// </" + "excerpt>";

  function derive(contract, source, corpus) {
    const hits = (contract.timing?.hits || []).map((h) => (typeof h === "number" ? { t: h, kind: "tick" } : { kind: "tick", ...h }));
    const cues = new Map(hits.filter((h) => h.cue).map((h) => [h.cue, h.t]));
    const reqs = contract.requirements;
    const count = (list, key) => list.reduce((m, x) => ((m[x[key]] = (m[x[key]] || 0) + 1), m), {});
    const lines = source.replace(/\n$/, "").split("\n");
    const open = lines.findIndex((l) => l.trim() === EXCERPT_OPEN), close = lines.findIndex((l) => l.trim() === EXCERPT_CLOSE);
    const body = lines.slice(open + 1, close);
    const indent = Math.min(...body.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
    const peakReq = reqs.find((r) => r.metric === "true_peak_dbtp" && r.op === "le");
    const v = contract.video;
    return {
      contract, corpus, hits, cues, reqs, reqCount: count(reqs, "kind"), hitCount: count(hits, "kind"),
      sourceLines: lines.length, excerpt: body.map((l, i) => ({ n: open + 2 + i, text: l.slice(indent) })),
      bpm: contract.timing?.bpm || 120, duration: v.duration, frames: Math.round(v.duration * v.fps),
      target: contract.audio?.loudness_target ?? null, ceiling: peakReq ? peakReq.target : null,
    };
  }

  // ---------- world layout ----------
  const STATION_X = [30, 70, 110, 150, 190];
  const STATION_NAMES = ["BRIEF", "CODE", "CAPTURE", "SOUND", "CHECK"];
  const STATION_ZOOM = 20, FIELD_ZOOM = 13;
  const ANCHOR = [1340, 870];
  const PANEL = { w: 904, h: 600, dx: -420, dy: -740 };
  const FPANEL = { w: 904, h: 460, dx: -440, dy: -690 };
  const FIELD = { x: -82, y: 6, cols: 25, rows: 19, pitch: 2.1, size: 1.6, blockRows: 24 };
  const CARD = { w: 9, d: 6, h: 0.5 };
  let A = null; // section times derived from cues (arrive/depart per station)

  function sectionTimes() {
    const arrive = ["brief", "code", "capture", "sound", "check"].map((s) => cue(`${s}.arrive`));
    const depart = arrive.slice(1).map((t) => t - 1.0).concat([cue("findings.arrive") - 1.1]);
    return { arrive, depart, find: cue("findings.arrive"), findDepart: cue("finale.arrive") - 1.0,
             fin: cue("finale.arrive"), lift: cue("open.lift"), end: DATA.duration };
  }

  // ---------- camera (keyframed poses; holds drift slowly, moves ease) ----------
  const POSE_KEYS = ["x", "y", "z", "zoom", "yaw", "pitch", "ox", "oy"];
  const stationPose = (i, drift) => ({ x: STATION_X[i] + 1.2 * drift, y: 0, z: 0, zoom: STATION_ZOOM * (1 + 0.025 * drift),
                                      yaw: 18 + 1.6 * drift, pitch: 30, ox: ANCHOR[0] - W / 2, oy: ANCHOR[1] - H / 2 });
  const fieldPose = (zoom, pitch, yaw, ox, oy, dx = 0) => ({ x: FIELD.x + dx, y: FIELD.y, z: 0, zoom, yaw, pitch, ox, oy });
  const overviewPose = (drift) => ({ x: 62 + 3 * drift, y: 6, z: 0, zoom: 3.1 * (1 + 0.05 * drift), yaw: 22 + 7 * drift, pitch: 46, ox: 470, oy: 160 });
  let SHOTS = null;

  function buildShots() {
    const s = [
      { t: 0, pose: fieldPose(17, 40, 14, 400, 90), move: true },
      { t: 2.4, pose: fieldPose(FIELD_ZOOM, 50, 22, 400, 60) },
      { t: A.lift + 0.1, pose: fieldPose(FIELD_ZOOM * 1.03, 51, 24, 400, 60), move: true, arc: { zoom: 0.3, pitch: 6, ox: 0, oy: 0 } },
    ];
    for (let i = 0; i < 5; i++) {
      s.push({ t: A.arrive[i], pose: stationPose(i, 0) });
      s.push({ t: A.depart[i], pose: stationPose(i, 1), move: true,
               arc: i === 4 ? { zoom: 0.72, pitch: 16, ox: -330, oy: -260 } : { zoom: 0.12, pitch: 2, ox: 0, oy: 0 } });
    }
    s.push({ t: A.find, pose: fieldPose(FIELD_ZOOM, 32, 18, 400, 290) });
    s.push({ t: A.findDepart, pose: fieldPose(FIELD_ZOOM * 1.03, 33, 20, 400, 290, 1.5), move: true });
    s.push({ t: A.fin + 0.4, pose: overviewPose(0) });
    s.push({ t: A.end, pose: overviewPose(1) });
    return s;
  }

  // Camera push-ins on chosen cues (fraction of zoom): fast attack, settled in ~0.5 s. The camera
  // reacts to the cue it hears; holds between them get broad, readable motion instead of a frozen frame.
  const PUNCHES = { "brief.row4": 0.012, "brief.freeze": 0.022, "brief.binned": 0.016, "code.type2": 0.012, "code.scrub": 0.02,
                    "code.match": 0.016, "capture.start": 0.02, "capture.encode": 0.022, "sound.beats": 0.024, "sound.wave": 0.02,
                    "sound.align": 0.022, "sound.meter": 0.016, "check.pop": 0.022, "check.hold": 0.022, "check.fixed": 0.016,
                    "check.row4": 0.014, "findings.gap": 0.016, "findings.loud": 0.02, "findings.loudmed": 0.014,
                    "findings.peak": 0.02, "findings.peakred": 0.014 };
  function punch(t) {
    let z = 0;
    for (const name in PUNCHES) {
      const tau = t - cue(name);
      if (tau > 0 && tau < 1.5) z += PUNCHES[name] * (1 - Math.exp(-tau / 0.03)) * Math.exp(-tau / 0.22);
    }
    return z;
  }

  function camera(t) {
    let i = 0;
    while (i < SHOTS.length - 2 && t >= SHOTS[i + 1].t) i++;
    const a = SHOTS[i], b = SHOTS[i + 1];
    const u = clamp((t - a.t) / (b.t - a.t));
    const p = a.move ? ease(u) : u;
    const cam = {};
    for (const k of POSE_KEYS) cam[k] = lerp(a.pose[k], b.pose[k], p);
    if (a.arc) {
      const bump = Math.sin(Math.PI * u);
      cam.zoom *= 1 - a.arc.zoom * bump;
      cam.pitch += a.arc.pitch * bump;
      cam.ox += a.arc.ox * bump;
      cam.oy += a.arc.oy * bump;
    }
    cam.zoom *= 1 + punch(t);
    const yaw = cam.yaw * Math.PI / 180, pitch = cam.pitch * Math.PI / 180;
    cam.cy = Math.cos(yaw); cam.sy = Math.sin(yaw); cam.cp = Math.cos(pitch); cam.sp = Math.sin(pitch);
    return cam;
  }

  function project(cam, x, y, z) {
    const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    const rx = dx * cam.cy - dy * cam.sy, ry = dx * cam.sy + dy * cam.cy;
    return [W / 2 + cam.ox + rx * cam.zoom, H / 2 + cam.oy - (ry * cam.sp + dz * cam.cp) * cam.zoom, ry * cam.cp - dz * cam.sp];
  }

  // ---------- drawing primitives ----------
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a = 1, f = 1) => { const [r, g, b] = hex(h); return `rgba(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)},${a})`; };
  const materials = {};
  function material(h) {
    return materials[h] || (materials[h] = { top: rgba(h, 1, 1), front: rgba(h, 1, 0.62), side: rgba(h, 1, 0.42) });
  }
  function poly(g, pts) {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function box(g, cam, x0, y0, z0, x1, y1, z1, m, alpha = 1) {
    const P = (x, y, z) => project(cam, x, y, z);
    const a = P(x0, y0, z0), b = P(x1, y0, z0), c = P(x1, y1, z0), d = P(x0, y1, z0);
    const e = P(x0, y0, z1), f = P(x1, y0, z1), gg = P(x1, y1, z1), h = P(x0, y1, z1);
    g.globalAlpha = alpha;
    g.fillStyle = m.side; poly(g, cam.sy >= 0 ? [a, d, h, e] : [b, c, gg, f]); g.fill();
    g.fillStyle = m.front; poly(g, [a, b, f, e]); g.fill();
    g.fillStyle = m.top; poly(g, [e, f, gg, h]); g.fill();
    g.globalAlpha = 1;
    return [e, f, gg, h];
  }
  function glow(g, x, y, r, color, alpha) {
    if (alpha <= 0.002) return;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, rgba(color, alpha)); grad.addColorStop(1, rgba(color, 0));
    g.fillStyle = grad; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }

  // ---------- world: background, floor, conveyor ----------
  function background(g) {
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#0C1532"); sky.addColorStop(0.6, "#081026"); sky.addColorStop(1, "#050914");
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    glow(g, 1380, 430, 900, "#3D63D8", 0.12);
  }

  function floorGrid(g, cam, mini) {
    const level = Math.log2(Math.max(1, 64 / cam.zoom)), base = Math.floor(level), frac = level - base;
    const fine = 2 * Math.pow(2, base + (mini ? 1 : 0)), coarse = fine * 2;
    const rx = -cam.ox / cam.zoom, ry = cam.oy / (cam.zoom * cam.sp);
    const cx = cam.x + rx * cam.cy + ry * cam.sy, cy = cam.y - rx * cam.sy + ry * cam.cy;
    const reach = Math.max(W / cam.zoom, H / (cam.zoom * cam.sp)) * 0.8;
    const buckets = [[], [], [], [], []];
    const x0 = Math.floor((cx - reach) / fine) * fine, y0 = Math.floor((cy - reach) / fine) * fine;
    for (let x = x0; x <= cx + reach; x += fine) {
      for (let y = y0; y <= cy + reach; y += fine) {
        const [sx, sy] = project(cam, x, y, 0);
        if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;
        const onCoarse = Math.abs(x % coarse) < 1e-6 && Math.abs(y % coarse) < 1e-6;
        const a = clamp((sy - 60) / 900) * (onCoarse ? 1 : 1 - frac);
        if (a > 0.04) buckets[Math.min(4, Math.floor(a * 5))].push(sx, sy);
      }
    }
    const r = mini ? 4 : 1.6;
    buckets.forEach((pts, b) => {
      g.fillStyle = `rgba(122,150,220,${(0.1 + 0.12 * b).toFixed(2)})`;
      g.beginPath();
      for (let i = 0; i < pts.length; i += 2) g.rect(pts[i] - r, pts[i + 1] - r, 2 * r, 2 * r);
      g.fill();
    });
  }

  function conveyor(g, t, cam, cardX) {
    const P = (x, y) => project(cam, x, y, 0);
    poly(g, [P(-8, -3.6), P(206, -3.6), P(206, 3.6), P(-8, 3.6)]);
    g.fillStyle = C.lane; g.fill();
    g.lineWidth = 2; g.strokeStyle = C.edge;
    for (const y of [-3.6, 3.6]) { const a = P(-8, y), b = P(206, y); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    g.lineWidth = 2.5;
    const offset = (t * 5) % 3;
    for (let x = -8 + offset; x < 205; x += 3) {
      const a = P(x - 0.7, -1.7), b = P(x + 0.5, 0), c = P(x - 0.7, 1.7);
      if (b[0] < -20 || b[0] > W + 20) continue;
      const near = cardX === null ? 0 : Math.exp(-Math.abs(x - cardX) / 12);
      g.strokeStyle = rgba(C.blue, 0.14 + 0.36 * near);
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.stroke();
    }
  }

  // ---------- the 475-tile wall ----------
  let TILES = null;
  function buildTiles() {
    const cats = DATA.corpus.categories, order = [];
    cats.forEach(([name, n], k) => { for (let j = 0; j < n; j++) order.push({ cat: name, k, j }); });
    const slots = order.map((_, i) => i);
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(hash(i * 31 + 7) * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
    const blockCols = cats.map(([, n]) => Math.ceil(n / FIELD.blockRows));
    const gap = 1.5, total = blockCols.reduce((a, b) => a + b, 0) + gap * (cats.length - 1);
    const starts = []; let c0 = 0;
    blockCols.forEach((w) => { starts.push(c0); c0 += w + gap; });
    const tiles = order.map((tile, i) => {
      const slot = slots[i], col0 = slot % FIELD.cols, row0 = Math.floor(slot / FIELD.cols);
      const col1 = starts[tile.k] + Math.floor(tile.j / FIELD.blockRows), row1 = tile.j % FIELD.blockRows;
      const band = row0 < 7 ? 0 : row0 < 13 ? 1 : 2;
      return {
        ...tile, i, color: CATEGORY_COLOR[tile.cat],
        x0: FIELD.x + (col0 - (FIELD.cols - 1) / 2) * FIELD.pitch, y0: FIELD.y + (row0 - (FIELD.rows - 1) / 2) * FIELD.pitch,
        x1: FIELD.x + (col1 - (total - 1) / 2) * FIELD.pitch, y1: FIELD.y + (row1 - (FIELD.blockRows - 1) / 2) * FIELD.pitch,
        rise: cue(`open.wave${band + 1}`) - 0.25 + 0.2 * (col0 / (FIELD.cols - 1) - 0.5),
        sort: cue("open.sort") + 0.25 * tile.k + 0.25 * hash(i * 7 + 3),
        measured: false,
      };
    });
    const picks = tiles.map((tile) => tile.i).sort((a, b) => hash(a * 13 + 5) - hash(b * 13 + 5));
    picks.slice(0, DATA.corpus.files.length).forEach((idx, f) => { tiles[idx].measured = true; tiles[idx].file = f; });
    const explainer = tiles.filter((tile) => tile.cat === "explainer");
    const lifted = explainer.find((tile) => tile.j === FIELD.blockRows + 2) || explainer[0];
    lifted.lifted = true;
    const byFile = [];
    for (const tile of tiles) if (tile.measured) byFile[tile.file] = tile;
    return { tiles, lifted, blockCols, starts, total, byFile };
  }

  function tilePosition(tile, t) {
    const p = ease((t - tile.sort) / 0.5);
    const x = lerp(tile.x0, tile.x1, p), y = lerp(tile.y0, tile.y1, p);
    let z = 2.2 * Math.sin(Math.PI * p);
    if (tile.measured) z += 1.4 * spring(t - cue("findings.lift") - 0.2 * hash(tile.i), 0.5, 0.7);
    return [x, y, z];
  }

  function risenCount(t) {
    let n = 0;
    for (const tile of TILES.tiles) if (t >= tile.rise + 0.15) n++;
    return n;
  }

  // ---------- the travelling card ----------
  function cardState(t) {
    if (t < A.lift) return null;
    if (t < A.arrive[0]) {
      const p = ease((t - A.lift) / (A.arrive[0] - A.lift));
      const [tx, ty] = tilePosition(TILES.lifted, A.lift);
      return { x: lerp(tx, STATION_X[0], p), y: lerp(ty, 0, p), z: 0.5 * (1 - p) + 7 * Math.sin(Math.PI * p), morph: smooth((p - 0.15) / 0.7), station: 0 };
    }
    let x = STATION_X[4], station = 4;
    for (let i = 0; i < 5; i++) {
      if (t < A.depart[i] || i === 4) { x = STATION_X[i]; station = i; break; }
      if (t < A.arrive[i + 1]) { x = lerp(STATION_X[i], STATION_X[i + 1], ease((t - A.depart[i]) / (A.arrive[i + 1] - A.depart[i]))); station = i; break; }
    }
    return { x, y: 0, z: 0, morph: 1, station };
  }

  const cardCanvas = document.createElement("canvas");
  cardCanvas.width = 360; cardCanvas.height = 240;
  function cardSkin(t, state) {

  function place(e, x, y, align, opacity) {
    const shift = align === "c" ? -50 : align === "r" ? -100 : 0;
    e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) translateX(${shift}%)`;
    show(e, opacity);
  }
  function words(parent, text) {
    return text.split(" ").map((w, i, all) => {
      const mask = document.createElement("span"); mask.className = "mask";
      const word = document.createElement("span"); word.className = "word"; word.textContent = w;
      mask.appendChild(word); parent.appendChild(mask);
      if (i < all.length - 1) parent.appendChild(document.createTextNode(" "));
      return word;
    });
  }
  function blockOpacity(block, t) {
    return t < block.from || t >= block.to ? 0 : 1 - easeIn((t - (block.to - 0.3)) / 0.3);
  }

  function textBlocks() {
    const s = DATA.corpus.summary;
    const specs = [
      { kicker: "A PUBLIC COLLECTION · READ 2026-10-06", headline: "475 videos, built by an AI that writes code.",
        desc: "How are they made? We read all 475 posts and measured 38 of the files.", from: 0.1, to: A.lift + 0.05,
        note: "Source: skillry.dev, Opus 5.5 collection" },
      { kicker: "01 · BRIEF", headline: "The prompt reads like a spec.", wrap: 560,
        desc: "Detailed briefs share one shape. The harness turns each section into a check it can measure, or a question for a person.",
        from: A.arrive[0] + 0.15, to: A.depart[0],
        note: "“Show me the state list on the beat grid before you write any code.” — @twoclipping", noteAt: 9.0 },
      { kicker: "02 · CODE", headline: "Every frame is a function of t.", wrap: 740,
        desc: "No timers, no state between frames. Seek to any moment, in any order, and the picture is the same.",
        from: A.arrive[1] + 0.15, to: A.depart[1] },
      { kicker: "03 · CAPTURE", headline: "A browser photographs every frame.",
        desc: `Headless Chromium seeks to t and takes a screenshot, ${fmt(DATA.frames)} times. Averaging sub-frames makes motion blur. FFmpeg encodes the result.`,
        from: A.arrive[2] + 0.15, to: A.depart[2] },
      { kicker: "04 · SOUND", headline: "Every sound lands by its peak.", wrap: 540,
        desc: `This film’s ${DATA.hits.length} cues sit on a ${DATA.bpm} BPM grid. Each is shifted so its loudest sample, not its first, hits the beat.`,
        from: A.arrive[3] + 0.15, to: A.depart[3] },
      { kicker: "05 · CHECK", headline: "Then it measures what it rendered.", wrap: 560,
        desc: "The harness decodes its own MP4. Frames, timestamps and loudness are measured from the file, not the preview.",
        from: A.arrive[4] + 0.15, to: A.depart[4] },
      { kicker: `06 · WHAT ${s.measured_files} FILES SHOW`, headline: "A new visual idea every 1.8 seconds.", wrap: 600,
        desc: "Medians, measured with this harness on the published files.", from: A.find + 0.15, to: A.findDepart,
        stats: [
          { num: `${s.median_gap_s.toFixed(2)} s`, what: "median gap between visual events", color: C.mint, at: cue("findings.gap") },
          { num: `${minus(s.median_lufs.toFixed(1))} LUFS`, what: `median loudness of the ${s.audible_files} audible files`, color: C.blue, at: cue("findings.loudmed") },
          { num: `${s.peak_above_minus1} of ${s.audible_files}`, what: "peak above −1 dBTP after X’s re-encode", color: C.coral, at: cue("findings.peakred") },
        ] },
      { finale: ["Written as code.", "Measured as video."], from: cue("finale.title1") - 0.05, to: Infinity },
    ];
    BLOCKS = specs.map((spec, i) => {
      const root = el(dom, "block");
      const block = { ...spec, root, i };
      if (spec.finale) {
        root.style.top = "236px";
        root.style.width = "1000px";
        block.lines = spec.finale.map((line, j) => {
          const h = el(root, "finale", undefined, j === 0 ? `headline-${i}` : `headline-${i}b`);
          return { words: words(h, line), at: cue(`finale.title${j + 1}`) };
        });
      } else {
        block.kick = el(root, "kicker", spec.kicker);
        const h = el(root, "headline", undefined, `headline-${i}`);
        if (spec.wrap) h.style.width = `${spec.wrap}px`;
        block.words = words(h, spec.headline);
        block.desc = el(root, "desc", spec.desc, `desc-${i}`);
        if (spec.note) block.note = el(root, "note", spec.note, `note-${i}`);
        block.stats = (spec.stats || []).map((st, j) => {
          const row = el(root, "stat");
          const num = el(row, "num", st.num, `stat-${j}`); num.style.color = st.color;
          el(row, "what", st.what, `stat-${j}-what`);
          return { row, at: st.at };
        });
      }
      return block;
    });
    updaters.push((t) => {
      for (const b of BLOCKS) {
        const o = blockOpacity(b, t);
        show(b.root, o);
        if (b.lines) {
          b.lines.forEach((line) => line.words.forEach((w, k) => {
            w.style.transform = `translateY(${((1 - spring(t - line.at - 0.05 * k, 0.5, 0.82)) * 118).toFixed(2)}%)`;
          }));
          continue;
        }
        const k0 = easeOut((t - b.from) / 0.35);
        b.kick.style.transform = `translateX(${((1 - k0) * 18).toFixed(2)}px)`;
        show(b.kick, k0);
        b.words.forEach((w, k) => { w.style.transform = `translateY(${((1 - spring(t - b.from - 0.12 - 0.05 * k, 0.5, 0.82)) * 118).toFixed(2)}%)`; });
        const d = smooth((t - b.from - 0.45) / 0.4);
        b.desc.style.transform = `translateY(${((1 - d) * 12).toFixed(2)}px)`;
        show(b.desc, d);
        if (b.note) show(b.note, smooth((t - (b.noteAt ?? b.from + 0.9)) / 0.4));
        b.stats.forEach((st) => { const p = easeOut((t - st.at) / 0.35); st.row.style.transform = `translateX(${((1 - p) * 24).toFixed(2)}px)`; show(st.row, p); });
      }
    });
  }

  // Labels positioned in a panel's local coordinates; visible only while the camera rests there.
  function panelLabels(stationIndex, specs) {
    const items = specs.map((s) => {
      const e = el(dom, `abs ${s.cls || "label"}`, s.text, s.id);
      if (s.color) e.style.color = s.color;
      return { ...s, e };
    });
    updaters.push((t, cam) => {
      let o, settle;
      if (stationIndex === "field") {
        o = panelOrigin(cam, [FIELD.x, FIELD.y, 0], FPANEL, FIELD_ZOOM);
        settle = windowed(t, A.find + 0.05, A.findDepart, 0.3, 0.25);
      } else {
        o = panelOrigin(cam, [STATION_X[stationIndex], 0, 0], PANEL, STATION_ZOOM);
        settle = windowed(t, A.arrive[stationIndex] + 0.05, A.depart[stationIndex], 0.3, 0.25);
      }
      for (const it of items) {
        if (it.text$) it.e.textContent = it.text$(t);
        if (it.color$) it.e.style.color = it.color$(t);
        const [x, y] = it.at$ ? it.at$(t) : [it.x, it.y];
        place(it.e, o.x + x * o.k, o.y + y * o.k, it.align || "l", settle * (it.show ? it.show(t) : 1));
      }
    });
  }

  const RULE_UNITS = { determinism_mismatches: "", true_peak_dbtp: " dBTP", audio_hit_sync_ms: " ms", text_overlap_violations: "",

  function findingsLabels() {
    const titles = ["median gap between visual events, s", "integrated loudness, LUFS", "true peak after re-encode, dBTP"];
    const specs = [];
    const stageOn = (k) => (t) => {
      const s = findingsStage(t);
      if (s.a === s.b) return s.a === k ? 1 : 0;
      return s.a === k ? 1 - s.p : s.b === k ? s.p : 0;
    };
    titles.forEach((title, k) => specs.push({ id: `fnd.title${k}`, text: title, x: 20, y: 14, color: C.soft, show: (t) => clamp(stageOn(k)(t) * 2 - 1) * smooth((t - cue("findings.lift")) / 0.3) }));

                                                                        show: (t) => clamp(stageOn(k)(t) * 2 - 1) * smooth((t - cue("findings.lift")) / 0.3) })));
    const s = DATA.corpus.summary;
    const medians = [`median ${s.median_gap_s.toFixed(2)} s`, `median ${minus(s.median_lufs.toFixed(1))} LUFS`, `${s.peak_above_minus1} of ${s.audible_files} above −1`];
    const markerX = [CHART_X(CHARTS[0], s.median_gap_s), CHART_X(CHARTS[1], s.median_lufs), CHART_X(CHARTS[2], -1)];
    const cues = ["findings.gap", "findings.loudmed", "findings.peakred"];
    medians.forEach((m, k) => specs.push({ id: `fnd.med${k}`, cls: "label strong", text: m, x: markerX[k] + 12, y: 52, color: k === 2 ? C.coral : C.ink,
                                          show: (t) => clamp(stageOn(k)(t) * 2 - 1) * smooth((t - cue(cues[k])) / 0.3) }));
    const silent = s.measured_files - s.audible_files;
    specs.push({ id: "fnd.silent", cls: "label sans", text: `${silent} silent files left out`, x: 884, y: 420, align: "r", color: C.dim,
                 show: (t) => { const st = findingsStage(t); return st.b > 0 ? (st.a > 0 ? 1 : clamp(st.p * 2 - 1)) : 0; } });
    specs.push({ id: "fnd.outlier", cls: "label sans", text: "one at 11.2 s", x: 884, y: 420, align: "r", color: C.dim,
                 show: (t) => clamp(stageOn(0)(t) * 2 - 1) * smooth((t - cue("findings.gap")) / 0.3) });
    panelLabels("field", specs);

  function openLabels() {
    const e = el(dom, "abs label strong", "", "open.count");
    const cats = DATA.corpus.categories.map(([name, n], k) => {
      const c = el(dom, "abs label strong", `${name} ${n}`, `open.cat${k}`);
      c.style.color = CATEGORY_COLOR[name];
      return { c, k, at: cue(`open.cat${k + 1}`) };
    });
    updaters.push((t, cam) => {
      const n = risenCount(t);
      e.textContent = `${pad(n, 3)} videos`;
      const [x, y] = project(cam, FIELD.x, FIELD.y + 21.5, 0.6);
      place(e, x, y - 36, "c", windowed(t, cue("open.count"), cue("open.sort") + 0.1, 0.25, 0.25));
      const out = windowed(t, cue("open.cat1"), A.lift - 0.05, 0.25, 0.3);
      cats.forEach(({ c, k, at }) => {
        const col = TILES.starts[k] + TILES.blockCols[k] / 2 - 0.5;
        const [bx, by] = project(cam, FIELD.x + (col - (TILES.total - 1) / 2) * FIELD.pitch, FIELD.y - (FIELD.blockRows / 2 + 0.8) * FIELD.pitch, 0);
        const half = c.textContent.length * 7.2 + 6;
        place(c, clamp(bx, 96 + half, W - 96 - half), by + 6, "c", smooth((t - at) / 0.2) * out);
      });
    });
  }

  function finaleLabels() {
    const rows = [[`1 HTML file`, `${fmt(DATA.sourceLines)} lines`, `${DATA.reqs.length} requirements`],
                  [`${DATA.hits.length} cues`, `${fmt(DATA.frames)} frames`, `${DATA.duration} s at ${DATA.contract.video.fps} fps`]];
    const label = el(dom, "abs label", "this film:", "finale.this");
    label.style.color = C.mint;
    let k = 0;
    const parts = rows.map((items, r) => {
      const row = el(dom, "abs label", "", `finale.stats${r}`);
      row.style.color = C.ink;
      const spans = items.map((item, j) => {
        const span = document.createElement("span"); span.textContent = (j ? "  ·  " : "") + item;
        row.appendChild(span); return { span, at: cue(`finale.stat${Math.min(5, ++k)}`) };
      });
      return { row, spans, r };
    });
    const credits = ["Made with codeable-video-harness · Chromium + FFmpeg", "Sound synthesized in code · no generative models",
                     "Research and data: docs/OPUS_VIDEO_RESEARCH.md"].map((text, j) => {
      const c = el(dom, "abs label sans", text, `finale.credit${j}`);
      c.style.color = j === 2 ? C.dim : C.soft;
      return c;
    });
    updaters.push((t) => {
      place(label, 96, 506, "l", smooth((t - cue("finale.stat1") + 0.15) / 0.3));
      parts.forEach(({ row, spans, r }) => {
        place(row, 96, 548 + 40 * r, "l", smooth((t - spans[0].at) / 0.2));
        spans.forEach(({ span, at }) => { span.style.opacity = smooth((t - at) / 0.2).toFixed(3); });
      });
      credits.forEach((c, j) => place(c, 96, 700 + 38 * j, "l", smooth((t - cue("finale.credit") - 0.15 * j) / 0.4)));
    });
  }

  function sheetLabels() {
    const caption = el(dom, "abs label sans", `this film’s contact sheet · ${SHEET.cols * SHEET.rows} of ${fmt(DATA.frames)} frames`, "sheet.caption");
    caption.style.color = C.soft;
    const stamps = Array.from({ length: SHEET.cols * SHEET.rows }, (_, i) => {
      const e = el(dom, "abs label", `${pad(sheetFrame(i).toFixed(0), 2)} s`, `sheet.t${i}`);
      e.style.color = C.ink;
      return e;
    });
    updaters.push((t) => {
      place(caption, SHEET.x, SHEET.y - 48, "l", smooth((t - sheetStart()) / 0.4));
      stamps.forEach((e, i) => {
        const [x, y] = sheetCell(i), enter = easeOut((t - sheetStart() - 0.06 * i) / 0.5);
        place(e, x + 10 + 260 * (1 - enter), y + SHEET.h - 29, "l", smooth((t - sheetStart() - 0.06 * i - 0.35) / 0.25));
      });
    });
  }

  function hud() {
    const brand = el(dom, "abs label", "HOW CODE BECOMES VIDEO", "hud.brand");
    brand.style.letterSpacing = "0.16em"; brand.style.color = C.dim;
    const clock = el(dom, "abs label", "", "hud.clock");
    const names = STATION_NAMES.map((n, i) => el(dom, "abs label", `${pad(i + 1, 2)} ${n}`, `rail.${i}`));
    updaters.push((t) => {
      place(brand, 96, 60, "l", 1);
      const f = Math.round(t * FPS);
      clock.textContent = `t ${pad(t.toFixed(2), 5)} s · frame ${pad(f, 4)} / ${fmt(DATA.frames)}`;
      place(clock, 1824, 60, "r", 1);
      const on = windowed(t, A.arrive[0] - 0.4, A.depart[4] + 0.2, 0.4, 0.4), progress = railProgress(t);
      names.forEach((e, i) => {
        const x = lerp(96, 1824, i / 4);
        e.style.color = Math.abs(progress - i / 4) < 0.02 ? C.ink : progress > i / 4 ? C.mint : C.dim;
        place(e, x, 958, i === 0 ? "l" : i === 4 ? "r" : "c", on);
      });
    });
  }

  function build() {
    A = sectionTimes();
    SHOTS = buildShots();
    TILES = buildTiles();
    CHIPS = chipPlan();
    SWARM = buildSwarm();
    WHOOSH = whooshSamples();
    textBlocks();
    briefLabels(); codeLabels(); captureLabels(); soundLabels(); checkLabels(); findingsLabels(); openLabels(); finaleLabels(); sheetLabels(); hud();
    for (const e of dom.querySelectorAll(".code")) highlight(e);
  }
  function highlight(e) {
    const text = e.textContent;
    e.textContent = "";
    for (const token of text.split(/(\b(?:function|const|for|of|return|let)\b|[(){};,.]|\b\d+\b|\b\w+(?=\())/)) {
      if (!token) continue;
      const span = document.createElement("span");
      span.textContent = token;
      span.className = /^(function|const|for|of|return|let)$/.test(token) ? "k" : /^\d+$/.test(token) ? "n" : /^[(){};,.]$/.test(token) ? "p" : /^\w+$/.test(token) && text.includes(token + "(") ? "f" : "";
      e.appendChild(span);
    }
  }

  const ctx = $("world").getContext("2d");
  // <excerpt>
  function seek(t) {
    const cam = camera(t);
    drawWorld(ctx, t, cam, false);
    for (const update of updaters)
      update(t, cam);
  }
  // </excerpt>

  async function load() {
    const contractUrl = harness ? "/contract.json" : "/examples/how-code-becomes-video.json";
    const [contract, source, corpus] = await Promise.all([
      fetch(contractUrl).then((r) => r.json()), fetch(location.pathname).then((r) => r.text()), fetch("corpus.json").then((r) => r.json()),
    ]);
    DATA = derive(contract, source, corpus);
    build();
  }

  vch.seek = seek;
  vch.ready = load();
  if (!harness) {
    const fit = () => { $("stage").style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; };
    fit(); addEventListener("resize", fit);
    vch.ready.then(() => {
      const loop = (now) => { seek((now / 1000) % DATA.duration); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
