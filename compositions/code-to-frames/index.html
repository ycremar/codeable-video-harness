<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code to frames</title>
<!--
  Original demonstration composition for the vch `html` backend.
  Contract: examples/html.json. Every visual property is computed inside seek(t):
  no CSS transitions, timers or state carried between frames. Springs are closed-form
  step responses, summed once per target change, so the film is a pure function of t.
  Preview without the harness: serve the repository root (python -m http.server) and
  open /compositions/code-to-frames/index.html; it then loops on the wall clock.
-->
<style>
  @font-face { font-family: "Inter"; src: url("/assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  :root { --paper: #F3EFE6; --ink: #15171C; --cobalt: #2B59FF; --night: #121418; --muted: #5E626B;
          --pass: #187A42; --fail: #C2361F; --sky: #8EA6FF; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--paper);
           font-family: "Inter", sans-serif; color: var(--ink); transform-origin: 0 0; }
  .abs { position: absolute; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.12em 0; }
  .word { display: inline-block; will-change: auto; }
  #headline { left: 64px; top: 120px; font-size: 64px; font-weight: 720; letter-spacing: -0.035em; line-height: 1.05; }
  #chapter { left: 64px; top: 48px; font-size: 24px; font-weight: 560; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  #unit { left: 0; top: 0; }
  #prompt { font-size: 30px; font-weight: 480; white-space: pre; color: #FFFFFF; }
  #caret { width: 3px; height: 34px; background: #FFFFFF; }
  .row { left: 0; top: 0; display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 520; }
  .tag { display: inline-block; min-width: 86px; padding: 6px 12px; border-radius: 10px; font-size: 22px;
         font-weight: 700; letter-spacing: 0.06em; text-align: center; color: #FFFFFF; }
  #counter { font-size: 26px; font-weight: 560; font-variant-numeric: tabular-nums; }
  .tickmark { width: 4px; height: 26px; border-radius: 2px; background: var(--ink); }
  #playhead { width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 6px rgba(43,89,255,0.25); }
  #flood { inset: 0; background: var(--night); }
  .chip { display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-radius: 22px;
          font-size: 30px; font-weight: 680; letter-spacing: 0.02em; color: #FFFFFF; }
  .chip svg { width: 30px; height: 30px; }
  #wordmark { font-size: 28px; font-weight: 600; letter-spacing: 0.01em; color: var(--muted); }
  #progress { left: 0; bottom: 0; height: 6px; background: var(--cobalt); }
</style>
</head>
<body>
<div id="stage">
  <div id="flood" class="abs"></div>
  <div id="unit" class="abs"></div>
  <div id="chapter" class="abs" data-vch-id="chapter"></div>
  <div id="headline" class="abs" data-vch-id="headline"></div>
  <div id="prompt" class="abs" data-vch-id="prompt"></div>
  <div id="caret" class="abs"></div>
  <div id="rows"></div>
  <div id="ticks"></div>
  <div id="playhead" class="abs"></div>
  <div id="counter" class="abs" data-vch-id="counter"></div>
  <svg id="wave" class="abs" width="1280" height="720" viewBox="0 0 1280 720" style="left:0;top:0">
    <path id="wavepath" fill="none" stroke="#8EA6FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    <g id="dots"></g>
  </svg>
  <div id="chips"></div>
  <div id="wordmark" class="abs" data-vch-id="wordmark">codeable-video-harness</div>
  <div id="progress" class="abs"></div>
</div>
<script>
(() => {
  const DURATION = 12, BEAT = 0.5;
  const C = { paper: "#F3EFE6", ink: "#15171C", cobalt: "#2B59FF", night: "#121418", sky: "#8EA6FF",
              pass: "#187A42", fail: "#C2361F", card: "#FFFFFF" };
  const $ = (id) => document.getElementById(id);

  // ---------- time primitives (pure functions of t) ----------
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const easeOut = (x) => 1 - (1 - clamp01(x)) ** 3;
  const easeIn = (x) => clamp01(x) ** 3;
  const mix = (a, b, p) => a + (b - a) * p;
  // Closed-form step response of a slightly underdamped spring (overshoot well under 2%).
  // Settled springs snap exactly to the target, so resting layouts sit on exact values.
  function spring(tau, period = 0.42, zeta = 0.82) {
    if (tau <= 0) return 0;
    const w = 2 * Math.PI / period, wd = w * Math.sqrt(1 - zeta * zeta);
    const v = 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + (zeta * w / wd) * Math.sin(wd * tau));
    return Math.abs(1 - v) < 1e-3 && tau > period ? 1 : v;
  }
  // Value that springs to each new target at its time: sum of one step response per change.
  function track(keys, t, period, zeta) {
    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * spring(t - keys[i][0], period, zeta);
    return v;
  }
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  function colorAt(keys, t, span = 0.35) {
    let c = hex(keys[0][1]);
    for (let i = 1; i < keys.length; i++) {
      const p = easeOut((t - keys[i][0]) / span), n = hex(keys[i][1]);
      c = c.map((v, j) => mix(v, n[j], p));
    }
    return `rgb(${c.map(Math.round).join(",")})`;
  }

  // ---------- storyboard (seconds on a 120 BPM grid) ----------
  const UNIT = {                  // the one persistent shape: [time, value]
    x: [[0, 628], [0.5, 260], [2, 640], [4, 140], [6, 140], [8, 360], [10, 68]],
    y: [[0, 388], [0.5, 352], [2, 276], [4, 438], [6, 640], [8, 600], [10, 372]],
    w: [[0, 24], [0.5, 760], [2, 560], [4, 1000], [6, 1000], [8, 560], [10, 900]],
    h: [[0, 24], [0.5, 96], [2, 330], [4, 64], [6, 6], [8, 6], [10, 10]],
    r: [[0, 12], [0.5, 48], [2, 28], [4, 32], [6, 3], [8, 3], [10, 5]],
  };
  const UNIT_COLOR = [[0, C.cobalt], [2, C.card], [4, C.cobalt], [6, C.sky], [10, C.cobalt]];
  const HEADLINES = [
    { from: 1.0, to: 1.85, text: "One prompt." },
    { from: 2.05, to: 3.85, text: "becomes a contract." },
    { from: 4.05, to: 5.8, text: "Every frame is f(t)." },
    { from: 6.35, to: 7.85, text: "Render. Decode. Measure." },
    { from: 8.05, to: 9.85, text: "Repair what failed." },
    { from: 10.3, to: 12.5, text: "Evidence, not vibes.", top: 236, size: 96 },
  ];
  const PROMPT = "a 12-second film about this harness";
  const ROWS = [
    { at: 2.5, tag: "HARD", color: C.ink, text: "duration = 12.0 s" },
    { at: 3.0, tag: "PROXY", color: C.cobalt, text: "text ≥ 24 px, inside margins" },
    { at: 3.5, tag: "HUMAN", color: "#5E626B", text: "does it read clearly?" },
  ];
  const TICKS = [4.5, 5.0, 5.5];
  const DOTS = [6.5, 7.0, 7.5];
  const CHIPS = [{ label: "SAFE", ok: 8.0 }, { label: "SYNC", ok: 8.0 }, { label: "HOLD", ok: 9.0 }];
  const DARK_FROM = 6.0, DARK_TO = 10.0;

  // ---------- build static DOM once (content only; no time state) ----------
  function words(text) {
    return text.split(" ").map((w) => `<span class="mask"><span class="word">${w}</span></span>`).join(" ");
  }
  $("rows").innerHTML = ROWS.map((r, i) => `<div class="row abs" data-vch-id="row${i}"><span class="tag" data-vch-id="tag${i}" style="background:${r.color}">${r.tag}</span><span>${r.text}</span></div>`).join("");
  $("ticks").innerHTML = TICKS.map(() => `<div class="tickmark abs"></div>`).join("");
  $("chips").innerHTML = CHIPS.map((c, i) => `<div class="chip abs" data-vch-id="chip${i}"><svg viewBox="0 0 30 30"><path stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>${c.label}</span></div>`).join("");
  const WAVE = Array.from({ length: 121 }, (_, i) => {
    const x = 140 + i * 1000 / 120, u = i / 120;
    const y = 470 - 120 * Math.sin(u * Math.PI * 5) * Math.exp(-1.4 * u) - 28 * Math.sin(u * Math.PI * 19) * u;
    return [x, y];
  });
  $("wavepath").setAttribute("d", WAVE.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(""));
  const waveLength = $("wavepath").getTotalLength();
  $("dots").innerHTML = DOTS.map(() => `<circle r="0" fill="#F3EFE6"></circle>`).join("");

  // ---------- per-frame state ----------
  function headline(t) {
    const el = $("headline");
    const active = HEADLINES.find((h) => t >= h.from - 0.3 && t < h.to + 0.3);
    if (!active) { el.innerHTML = ""; delete el.dataset.text; return; }
    if (el.dataset.text !== active.text) { el.innerHTML = words(active.text); el.dataset.text = active.text; }
    el.style.top = `${active.top ?? 120}px`;
    el.style.fontSize = `${active.size ?? 64}px`;
    const dark = t >= DARK_FROM && t < DARK_TO;
    el.style.color = dark ? C.paper : C.ink;
    [...el.querySelectorAll(".word")].forEach((w, i) => {
      const enter = spring(t - active.from - i * 0.06, 0.5, 0.86);
      const exit = easeIn((t - (active.to - 0.15 + i * 0.03)) / 0.18);
      w.style.transform = `translateY(${(1 - enter) * 130 - exit * 130}%)`;
    });
  }

  function unit(t) {
    const x = track(UNIT.x, t), y = track(UNIT.y, t), w = track(UNIT.w, t), h = track(UNIT.h, t), r = track(UNIT.r, t);
    const s = $("unit").style;
    const appear = spring(t, 0.4, 0.7);
    s.left = `${x}px`; s.top = `${y}px`; s.width = `${Math.max(0, w)}px`; s.height = `${Math.max(0, h)}px`;
    s.borderRadius = `${Math.max(0, r)}px`; s.background = colorAt(UNIT_COLOR, t);
    s.transform = `scale(${appear})`; s.transformOrigin = "50% 50%";
    s.boxShadow = t >= 1.8 && t < 4.2 ? `0 24px 60px rgba(21,23,28,${0.14 * easeOut((t - 1.8) / 0.4) * (1 - easeOut((t - 3.9) / 0.3))})` : "none";
    return { x, y, w, h };
  }

  function prompt(t, box) {
    const typed = Math.floor(clamp01((t - 0.75) / 1.0) * PROMPT.length);
    const leave = easeIn((t - 1.8) / 0.2);
    const el = $("prompt");
    el.textContent = PROMPT.slice(0, typed);
    el.style.left = `${box.x + 44}px`; el.style.top = `${box.y + 28}px`;
    el.style.opacity = t < 0.75 || t >= 2.0 ? 0 : 1 - leave;
    const caret = $("caret").style;
    caret.left = `${box.x + 46 + el.getBoundingClientRect().width}px`; caret.top = `${box.y + 31}px`;
    caret.opacity = t >= 0.65 && t < 1.9 && Math.floor(t / 0.25) % 2 === 0 ? 1 : 0;
  }

  function rows(t, box) {
    [...$("rows").children].forEach((row, i) => {
      const p = spring(t - ROWS[i].at, 0.45, 0.85), leave = easeIn((t - 3.8) / 0.2);
      row.style.left = `${box.x + 36 + (1 - p) * 40}px`;
      row.style.top = `${box.y + 52 + i * 82}px`;
      row.style.opacity = t < ROWS[i].at || t >= 4.0 ? 0 : clamp01(p) * (1 - leave);
    });
  }

  function timeline(t, box) {
    const on = t >= 4.0 && t < 6.0;
    [...$("ticks").children].forEach((tick, i) => {
      const p = spring(t - TICKS[i], 0.35, 0.7);
      tick.style.left = `${140 + (TICKS[i] - 4.0) / 2 * 1000}px`; tick.style.top = `${box.y - 40}px`;
      tick.style.opacity = on && t >= TICKS[i] ? 1 : 0;
      tick.style.transform = `scaleY(${p})`;
    });
    const head = $("playhead").style;
    const sweep = clamp01((t - 4.25) / 1.75);
    head.left = `${box.x + 18 + sweep * (box.w - 64)}px`; head.top = `${box.y + box.h / 2 - 14}px`;
    head.opacity = t >= 4.25 && t < 6.0 ? 1 : 0;
    const counter = $("counter");
    counter.textContent = `frame ${String(Math.floor(t * 30)).padStart(3, "0")} / 360`;
    counter.style.left = "64px"; counter.style.top = `${box.y + 104}px`;
    counter.style.opacity = on ? 1 - easeIn((t - 5.8) / 0.2) : 0;
  }

  function flood(t) {
    // A circle grows out of the timeline playhead (6.0) and later shrinks into the last chip (10.0).
    const grow = easeOut((t - DARK_FROM) / 0.32), shrink = easeIn((t - DARK_TO) / 0.3);
    const radius = t < DARK_FROM ? 0 : 1500 * (t < DARK_TO ? grow : 1 - shrink);
    const [cx, cy] = t < DARK_TO ? [1108, 470] : [840, 440];
    $("flood").style.clipPath = `circle(${radius}px at ${cx}px ${cy}px)`;
    $("stage").style.background = C.paper;
  }

  function wave(t) {
    const draw = easeOut((t - 6.3) / 1.4), gone = easeIn((t - 7.85) / 0.15);
    const path = $("wavepath");
    path.style.strokeDasharray = `${waveLength}`;
    path.style.strokeDashoffset = `${waveLength * (1 - draw)}`;
    path.style.opacity = t >= 6.3 && t < 8.0 ? 1 - gone : 0;
    [...$("dots").children].forEach((dot, i) => {
      const k = Math.round((DOTS[i] - 6.3) / 1.4 * 120);
      const [x, y] = WAVE[Math.min(120, Math.max(0, k))];
      dot.setAttribute("cx", x); dot.setAttribute("cy", y);
      dot.setAttribute("r", t >= DOTS[i] && t < 8.0 ? 12 * spring(t - DOTS[i], 0.3, 0.6) * (1 - gone) : 0);
    });
  }

  function chips(t) {
    [...$("chips").children].forEach((chip, i) => {
      const enter = spring(t - (8.0 + i * 0.12), 0.45, 0.85), leave = easeIn((t - 9.85) / 0.15);
      const ok = t >= CHIPS[i].ok, flip = CHIPS[i].ok > 8.0 ? spring(t - CHIPS[i].ok, 0.35, 0.6) : 1;
      chip.style.left = `${364 + i * 196}px`; chip.style.top = `${404 + (1 - enter) * 30}px`;
      chip.style.opacity = t >= 8.0 && t < 10.0 ? clamp01(enter) * (1 - leave) : 0;
      chip.style.background = ok ? C.pass : C.fail;
      chip.style.transform = `scale(${ok ? 0.9 + 0.1 * flip : 1})`;
      chip.querySelector("path").setAttribute("d", ok ? "M6 16 L12.5 22 L24 8" : "M8 8 L22 22 M22 8 L8 22");
    });
  }

  function finale(t) {
    const p = spring(t - 10.75, 0.5, 0.86);
    const s = $("wordmark").style;
    s.left = "68px"; s.top = `${408 + (1 - p) * 24}px`; s.opacity = t >= 10.75 ? clamp01(p) : 0;
  }

  // The label sits where the wipe edge passes, so it steps out of the way and swaps colour unseen.
  function wipeFade(t) {
    let o = 1;
    for (const w of [DARK_FROM, DARK_TO]) {
      o = Math.min(o, 1 - clamp01((t - (w - 0.1)) / 0.1) + clamp01((t - (w + 0.35)) / 0.1));
    }
    return clamp01(o);
  }

  function chrome(t) {
    const bar = Math.min(5, Math.floor(t / 2));
    const dark = t >= DARK_FROM + 0.2 && t < DARK_TO + 0.2;
    const el = $("chapter");
    el.textContent = `${String(bar + 1).padStart(2, "0")} / 06`;
    el.style.color = dark ? "#9AA0AA" : "#5E626B";
    el.style.opacity = wipeFade(t);
    $("progress").style.width = `${1280 * t / DURATION}px`;
    $("progress").style.background = dark ? C.sky : C.cobalt;
  }

  function seek(t) {
    flood(t);
    const box = unit(t);
    headline(t); prompt(t, box); rows(t, box); timeline(t, box); wave(t); chips(t); finale(t); chrome(t);
  }

  window.__vch = window.__vch || {};
  window.__vch.seek = seek;
  if (!window.__vch.harness) {
    const fit = () => { $("stage").style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 720)})`; };
    fit(); addEventListener("resize", fit);
    const loop = (now) => { seek((now / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
