<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper hills</title>
<!--
  Short three.js clip (contract: examples/three-paper.json). Six extruded paper ridges (seeded silhouettes)
  cast soft shadows on one another; a paper sun rises between the far sheets; paper birds flap across.
  Depth comes from parallax (the camera trucks sideways), soft shadows and depth of field. Pure f(t).
-->
<style>
  @font-face { font-family: "Inter"; src: url("/assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "JBMono"; src: url("/assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F3E6D3; transform-origin: 0 0;
           font-family: "Inter", sans-serif; color: #23302C; }
  canvas { position: absolute; left: 0; top: 0; }
  .abs { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .kicker { font: 600 22px/1.2 "JBMono", monospace; letter-spacing: 0.3em; color: #1F433E; }
  .title { font-weight: 300; font-size: 66px; line-height: 1.04; letter-spacing: -0.025em; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.05em 0.12em 0; margin-bottom: -0.12em; }
  .word { display: inline-block; }
  .caption { font-size: 24px; line-height: 1.42; color: #2E3A36; white-space: normal; width: 440px; }
</style>
<script type="importmap">{ "imports": { "three": "/compositions/_vendor/three/build/three.module.js",
                                         "three/addons/": "/compositions/_vendor/three/addons/" } }</script>
</head>
<body>
<div id="stage"><canvas id="gl" width="1280" height="720"></canvas><div id="dom"></div></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { clamp, lerp, ease, easeOut, smooth, seeded, loadContract, el, show, place, maskedWords, riseWords, preview } from "/compositions/_lib/clip.js";

const W = 1280, H = 720;
const vch = (window.__vch = window.__vch || {});
const SHEETS = [
  { z: -11, h: 2.5, color: "#E4D6BD", rough: 0.9 }, { z: -8.6, h: 2.1, color: "#CCD2B6", rough: 1.1 },
  { z: -6.4, h: 1.6, color: "#A9C1A1", rough: 1.3 }, { z: -4.4, h: 1.1, color: "#7FA48A", rough: 1.5 },
  { z: -2.7, h: 0.6, color: "#557F70", rough: 1.7 }, { z: -1.2, h: 0.1, color: "#2F5A50", rough: 2.0 },
];
let renderer, composer, scene, camera, bokeh, sheets, sun, birds, clouds, C, T, TEXT;
const dom = document.getElementById("dom");

function paperGrain() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), img = g.createImageData(256, 256), rand = seeded(41);
  for (let i = 0; i < 256 * 256; i++) { const v = 200 + Math.round(55 * rand()); img.data.set([v, v, v, 255], i * 4); }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8, 3);
  return tex;
}

// A ridge silhouette from a few seeded sine octaves, closed at the bottom, extruded like card stock.
function ridge(spec, k, grain) {
  const rand = seeded(100 + k), phases = [rand(), rand(), rand()].map((x) => x * Math.PI * 2);
  const shape = new THREE.Shape(), width = 34, steps = 120;
  shape.moveTo(-width / 2, -4);
  for (let i = 0; i <= steps; i++) {
    const x = -width / 2 + (width * i) / steps;
    const y = spec.h + 0.55 * spec.rough * Math.sin(0.35 * x + phases[0]) + 0.25 * spec.rough * Math.sin(0.9 * x + phases[1])
      + 0.1 * spec.rough * Math.sin(2.3 * x + phases[2]);
    shape.lineTo(x, y);
  }
  shape.lineTo(width / 2, -4); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 1, curveSegments: 4 });
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: spec.color, roughness: 0.95, bumpMap: grain, bumpScale: 0.6 }));
  mesh.position.z = spec.z; mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

function bird() {
  const wing = new THREE.BufferGeometry();
  wing.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0, -0.32, 0.04, -0.1, 0, 0, -0.18], 3));
  wing.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: "#2B2B28", side: THREE.DoubleSide, roughness: 0.9 });
  const g = new THREE.Group(), left = new THREE.Mesh(wing, mat), right = new THREE.Mesh(wing, mat);
  right.scale.x = -1; g.add(left, right); g.userData = { left, right };
  return g;
}

function build() {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
  scene = new THREE.Scene();
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.ShaderMaterial({ depthWrite: false, toneMapped: false,
    vertexShader: "varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    // Linear-light colours (the output pass tone-maps and encodes the whole frame): pale blue over cream.
    fragmentShader: "varying vec2 vU; void main(){ vec3 top = vec3(0.45,0.66,0.75), low = vec3(0.95,0.79,0.60);" +
      " gl_FragColor = vec4(mix(low, top, smoothstep(0.45, 0.75, vU.y)), 1.0); }" }));
  sky.position.set(0, 6, -14); scene.add(sky);
  // Paper clouds: unions of discs extruded like the hills, drifting at three depths.
  clouds = [[-2, 5.6, -10.4, 1.0], [5, 6.4, -7.6, 0.8], [11, 5.2, -5.6, 0.65]].map(([x, y, z, sz], i) => {
    const shape = new THREE.Shape(), lobes = [[-1.2, 0, 0.8], [-0.2, 0.35, 1.05], [0.9, 0.05, 0.85], [1.8, -0.1, 0.6]];
    const geo = new THREE.ExtrudeGeometry(lobes.map(([lx, ly, r]) => { const c = new THREE.Shape(); c.absarc(lx, ly, r, 0, Math.PI * 2); return c; }),
      { depth: 0.05, bevelEnabled: false, curveSegments: 24 });
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: "#FBF4E8", roughness: 0.95 }));
    m.scale.setScalar(sz); m.position.set(x, y, z); m.userData = { x, speed: 0.35 + 0.2 * i };
    scene.add(m);
    return m;
  });
  camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  const grain = paperGrain();
  sheets = SHEETS.map((spec, k) => { const m = ridge(spec, k, grain); scene.add(m); return m; });
  sun = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.05, 64), new THREE.MeshStandardMaterial({ color: "#F4B26A", roughness: 0.9, emissive: "#F0A050", emissiveIntensity: 0.35 }));
  sun.rotation.x = Math.PI / 2; sun.position.z = -9.8; sun.castShadow = true; scene.add(sun);
  birds = Array.from({ length: 5 }, (_, i) => { const b = bird(); b.userData.i = i; scene.add(b); return b; });

  scene.add(new THREE.HemisphereLight("#FFF6EA", "#9DB3A2", 1.1));
  const key = new THREE.DirectionalLight("#FFF1DC", 2.4); key.position.set(-6, 9, 8); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 10; key.shadow.blurSamples = 16;
  Object.assign(key.shadow.camera, { left: -16, right: 16, top: 10, bottom: -6, near: 1, far: 40 }); scene.add(key);

  const target = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, target);
  composer.addPass(new RenderPass(scene, camera));
  bokeh = new BokehPass(scene, camera, { focus: 9, aperture: 0.0016, maxblur: 0.007 });
  composer.addPass(bokeh);
  composer.addPass(new OutputPass());
}

function buildText() {
  const kicker = el(dom, "abs kicker", "PAPER", "kicker");
  const title = el(dom, "abs title", undefined, "title");
  const words = maskedWords(title, "Six sheets of paper");
  const caption = el(dom, "abs caption", "Depth from parallax and soft shadows alone; the sun is a seventh sheet.", "caption");
  TEXT = { kicker, title, words, caption };
}

function seek(t) {
  const u = t / T.duration, gust = t >= C("gust") ? Math.exp(-(t - C("gust")) / 0.8) * Math.sin((t - C("gust")) * 9) : 0;
  sheets.forEach((m, k) => {
    m.position.y = 0.06 * Math.sin(t * 1.3 + k) + 0.22 * gust * (k + 1) / 6;
    m.rotation.z = 0.006 * Math.sin(t * 0.9 + 2 * k) + 0.03 * gust * (k % 2 ? 1 : -1);
  });
  sun.position.set(lerp(2.0, 3.0, u), lerp(-0.8, 4.4, ease((t - C("sun.up") + 0.1) / 1.6)), -9.8);
  clouds.forEach((m) => { m.position.x = m.userData.x - m.userData.speed * t * 2.2; });
  birds.forEach((b) => {
    const i = b.userData.i, p = (t - C("birds") + 0.3 * i) / 4.5;
    b.visible = p > 0 && p < 1;
    b.position.set(lerp(-7, 6, p) + 0.4 * i, 3.4 + 0.35 * Math.sin(2 * p + i) + 0.2 * i, -3.0 - 0.4 * i); b.scale.setScalar(1.5);
    const flap = 0.7 * Math.sin(t * 11 + i * 1.7);
    b.userData.left.rotation.z = flap; b.userData.right.rotation.z = -flap;
  });
  camera.position.set(lerp(-5.5, 5.5, u), lerp(1.8, 2.5, u), lerp(9.6, 8.2, u));
  camera.lookAt(lerp(-2.6, 2.8, u), 2.9, -5);
  // Small push-ins on the cues that open each beat, settling within half a second.
  const punch = ["birds", "gust", "sun.high", "settle", "sun.up"].reduce((z, name) => {
    const tau = t - C(name);
    return tau > 0 && tau < 1.5 ? z + 0.03 * (1 - Math.exp(-tau / 0.03)) * Math.exp(-tau / 0.25) : z;
  }, 0);
  camera.fov = 30 * (1 - punch); camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  bokeh.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(0, 1.5, -4.4));
  composer.render();
  place(TEXT.kicker, 64, 52, "l", smooth((t - C("title.in") + 0.2) / 0.3));
  place(TEXT.title, 64, 86, "l", 1); riseWords(TEXT.words, t, C("title.in"));
  place(TEXT.caption, 64, 172, "l", smooth((t - C("caption.in")) / 0.4));
}

vch.seek = seek;
vch.ready = loadContract("/examples/three-paper.json").then((loaded) => {
  C = loaded.cue; T = { duration: loaded.contract.video.duration };
  build(); buildText();
  if (!loaded.harness) preview(document.getElementById("stage"), W, H, T.duration, seek);
});
</script>
</body>
</html>
