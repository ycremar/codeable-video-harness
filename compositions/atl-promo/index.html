  clay: (R, rnd, o = {}) => hitClip(R, rnd, { dur: 0.3, click: 0.5, clickMs: 0.9, noise: 0.25, noiseMs: 12, noiseLP: 2600, grit: 0.16, gritMs: 45,

  light: (R, rnd, o = {}) => hitClip(R, rnd, { dur: 0.9, click: 0.9, clickMs: 2.0, noise: 0.3, noiseMs: 16, noiseLP: 4200,
    modes: [{ f: 64, a: 0.55, d: 0.07 }, { f: 141, a: 0.32, d: 0.05 }, { f: 2120, a: 0.1, d: 0.012 }, { f: 3310, a: 0.07, d: 0.008 }],

// Freeverb-style room: parallel damped combs into series allpasses.
