<title>A Tennis Lab</title>
<!--
  Pre-opening promo for A Tennis Lab (contracts: examples/atl-promo.json, examples/atl-promo-vertical.json).
  One continuous three.js world: a dark indoor studio with four half-court training lanes and The Wall.
  Ball machines feed balls along closed-form arcs into floor targets; landing marks are a pure function of
  t; last session's marks stay while this session continues; the focus lane then opens into a full match
  court and the last practice ball is played across the net. Layout adapts to landscape or portrait.

// ---------------------------------------------------------------- world constants (metres)
const LANES = [-15, -5, 5, 15], FOCUS = 1, LX = LANES[FOCUS];

const TARGETS = [[-2.6, 10.3], [2.6, 10.3], [-0.2, 7.4]];

  const segs = [{ t0: launch, t1: land, p0, p1, h: 1.15 }];

function buildBalls() {

  [1, 0, 1, 0].forEach((tg, i) => B.push(feed(`l${i}`, i, tg, 0.5, 1, 10 + i)));
  // During the reveal every lane keeps running its drill; only each lane's first ball carries a cue sound.
  [0, 1, 2, 3].forEach((i) => [1.15, 2.3].forEach((dt, j) =>
    B.push(feed(`l${i}x${j}`, i, (i + j + 1) % 3, 0.5, 1, 50 + 3 * i + j, true, C(`l${i}.land`) + dt))));
  [0, 1, 2, 0, 1].forEach((tg, i) => B.push(feed(`r${i}`, FOCUS, tg, 0.62, 1, 20 + i)));
  [0, 1, 2, 1].forEach((tg, i) => B.push(feed(`s${i}`, FOCUS, tg, 0.22, 2, 30 + i)));
  // The Wall: a rally ball off the wall and back to the floor.
  { const hit = C("wall.hit"), bnc = C("wall.bounce");
    const a = v3(WALL_X - 1.2, 1.0, 7.6), b = v3(WALL_X + 0.4, 1.55, -0.95), c = v3(WALL_X + 1.1, 0, 4.4);
    const segs = [{ t0: hit - 0.6, t1: hit, p0: a, p1: b, h: 0.55 }, { t0: hit, t1: bnc, p0: b, p1: c, h: 0.7 }];
    const end = bounceTail(segs, c, b, bnc, c.clone().sub(b));
    B.push({ name: "wall", lane: 4, target: -1, session: 1, segs, land: bnc, launch: hit - 0.6, mark: null, end }); }

  { const m = feed("m", FOCUS, 0, 0.1, 2, 40, false);
    const hitT = C("m.hit"), farT = C("m.far");
    const hp = v3(LX - 2.9, 0.95, 11.7), far = v3(LX + 3.1, 0, -10.2);
    m.segs.push({ t0: m.land, t1: hitT, p0: m.mark, p1: hp, h: 0.35 });
    m.segs.push({ t0: hitT, t1: farT, p0: hp, p1: far, h: 2.1 });
    m.end = bounceTail(m.segs, far, hp, farT, far.clone().sub(hp), 1.4);

  { const pts = [v3(LX + 3.1, 0.9, -12.2), v3(LX - 2.4, 0, 9.6), v3(LX - 2.6, 0.95, 11.6), v3(LX + 2.2, 0, -9.4),

    const t0 = 25.7;

    for (let k = 0; k < 5; k++) {
      const ta = t0 + k * 1.25;
      segs.push({ t0: ta, t1: ta + 0.85, p0: pts[2 * k], p1: pts[2 * k + 1], h: 1.9 });
      segs.push({ t0: ta + 0.85, t1: ta + 1.25, p0: pts[2 * k + 1], p1: k < 4 ? pts[2 * k + 2] : pts[2 * k + 1].clone().add(v3(0, 0, 2)), h: 0.55 });
    }

}
function ballPos(b, t, out) {
  for (const s of b.segs) if (t < s.t1) {
    const u = clamp((t - s.t0) / (s.t1 - s.t0));
    out.lerpVectors(s.p0, s.p1, u); out.y += 4 * s.h * u * (1 - u); return out;
  }
  return out.copy(b.segs.at(-1).p1);

// ---------------------------------------------------------------- textures (built once, deterministic)
function gridTexture(cells, line, alpha) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = `rgba(255,255,255,${alpha})`; g.lineWidth = line;
  const s = 128 / cells;
  for (let k = 0; k <= cells; k++) { g.beginPath(); g.moveTo(k * s, 0); g.lineTo(k * s, 128); g.stroke(); g.beginPath(); g.moveTo(0, k * s); g.lineTo(128, k * s); g.stroke(); }

// ---------------------------------------------------------------- scene graph
const lanes = [], mats = { far: [], others: [], wall: [] };
let farGroup, wallBay, match, lights = {}, inst = {}, targetMeshes = [], curtains = [], fixtures = [], nets = [], machines = [];

    post.position.set(s * NET_W / 2, 0.535, 0); post.userData.side = s; g.add(post);

}
function buildMachine(i) {

  const body = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.5, 0.78, 4, 0.08), stdMat(COL.machine, { metalness: 0.55, roughness: 0.38 }));
  body.position.y = 0.42; g.add(body);

    wheel.rotation.z = Math.PI / 2; wheel.position.set(s * 0.34, 0.11, -0.22); g.add(wheel);

function buildFar() {

  place(TX.rail, L.x, L.hudY, "l", (idx === 0 ? hudIn : 1) * blink * hudOut);
  place(TX.url, W - (P ? 72 : 120), L.hudY, "r", hudIn * hudOut);
  TX.track.style.width = `${tw}px`; TX.track.style.transform = `translate(${L.x}px, ${ty}px)`; TX.track.style.opacity = (0.9 * hudIn * hudOut).toFixed(3);
  TX.bar.style.width = `${tw}px`; TX.bar.style.transform = `translate(${L.x}px, ${ty}px) scaleX(${clamp(t / 27).toFixed(4)})`; TX.bar.style.opacity = (hudIn * hudOut).toFixed(3);
  // Closing card.
  const cardIn = smooth((t - 26.9) / 0.6);
  show(TX.cardScrim, cardIn);
  TX.rule.style.transform = `scaleX(${easeOut((t - 27.5) / 0.6).toFixed(3)})`; show(TX.rule, smooth((t - 27.5) / 0.2));
  rise(TX.word, t, C("wordmark.in"), 34);
  rise(TX.sub, t, C("wordmark.in") + 0.45);
  rise(TX.soon, t, C("wordmark.in") + 0.75, 16);
  rise(TX.cta, t, C("cta.on"), 22);
  rise(TX.curl, t, C("cta.on") + 0.35, 18);
  const sweep = ((t - C("cta.on") - 0.6) / 1.6) % 1;
  TX.sheen.style.transform = `translateX(${(t < C("cta.on") + 0.6 ? -200 : lerp(-200, 560, sweep)).toFixed(1)}px)`;
}

function seek(t) {
  cameraAt(t);
  worldAt(t);
  composer.render();
  textAt(t);
}

vch.seek = seek;
vch.ready = loadContract("/examples/atl-promo.json").then(async (loaded) => {
  C = loaded.cue; T = { duration: loaded.contract.video.duration };
  W = loaded.contract.video.width; H = loaded.contract.video.height; P = H > W;
  const stage = document.getElementById("stage"); stage.style.width = `${W}px`; stage.style.height = `${H}px`;
  await Promise.all([document.fonts.load('800 100px "Inter"'), document.fonts.load('500 24px "JBMono"'), document.fonts.load('60px "NotoSC"', "下次接着练")]);
  build(); buildSpline(); buildText();
  if (!loaded.harness) preview(stage, W, H, T.duration, seek);
});
</script>
